[plugin_settings."nomadcxx/gslapper"]
hidden_behavior = "none"
video_directory = "@FLAKE@/assets/backgrounds/animated"

[plugins]
enabled = [
    "avivbintangaringga/nix-monitor",
    "profidev/hypr-screen-mirror",
    "noctalia/bitwarden",
    "noctalia/translator",
    "nomadcxx/gslapper"
]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

[theme]
builtin = "Rosé Pine"
community_palette = "Monochrome"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "hyprland", "kitty", "qt", "starship" ]
    community_ids = [ "obsidian", "vscode", "rofi", "discord", "steam", "hyprtoolkit" ]
    enable_builtin_templates = true
    enable_community_templates = true

[wallpaper]
directory = "@FLAKE@/assets/backgrounds/normal"
transition_on_startup = true

    [wallpaper.automation]
    enabled = true

    [wallpaper.default]
    path = "@FLAKE@/assets/backgrounds/berserk/Armor.jpg"

    [wallpaper.last]
    path = "@FLAKE@/assets/backgrounds/berserk/Armor.jpg"

    [wallpaper.monitors.DP-4]
    path = "@FLAKE@/assets/backgrounds/berserk/Armor.jpg"

    [wallpaper.monitors.HDMI-A-2]
    path = "@FLAKE@/assets/backgrounds/berserk/Armor.jpg"


[widget.gslapper]
type = "nomadcxx/gslapper:wallpaper"

[widget.media]
capsule = true
hide_when_no_media = true
title_scroll = "on_hover"

[widget.workspaces]
capsule = true
hide_when_empty = true
