[bar]
order = [ "Chrisser" ]

    [bar.Chrisser]
    center = [ "workspaces" ]
    end = [ "group:g4", "group:g1", "group:g2" ]
    font_family = "CaskaydiaCove Nerd Font"
    margin_edge = 0
    margin_ends = 0
    radius = 0
    start = [ "group:g3", "group:g5" ]
    widget_spacing = 10

        [[bar.Chrisser.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border = "primary"
        enabled = true
        fill = "surface_variant"
        foreground = "primary"
        id = "g1"
        members = [ "volume", "battery", "brightness", "bluetooth", "gslapper" ]
        opacity = 1.0
        padding = 6.0

        [[bar.Chrisser.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border = "primary"
        enabled = true
        fill = "surface_variant"
        foreground = "tertiary"
        id = "g2"
        members = [ "control-center", "clock", "session" ]
        opacity = 1.0
        padding = 6.0

        [[bar.Chrisser.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border = "primary"
        enabled = true
        fill = "surface_variant"
        foreground = "secondary"
        id = "g3"
        members = [ "network", "cpu", "ram" ]
        opacity = 1.0
        padding = 10.0

        [[bar.Chrisser.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border = "primary"
        enabled = true
        fill = "surface_variant"
        foreground = "secondary"
        id = "g4"
        members = [ "notifications", "clipboard" ]
        opacity = 1.0
        padding = 6.0

        [[bar.Chrisser.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g5"
        members = [ "media", "audio_visualizer" ]
        opacity = 1.0
        padding = 6.0

[calendar]
enabled = true

    [calendar.account.personal_google_calendar]
    color = "primary"
    type = "google"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
auto_hide = true

